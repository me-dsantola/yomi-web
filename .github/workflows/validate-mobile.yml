name: Validate mobile PR
on:
  pull_request:
  push:
    branches: [main, fix/mobile-reader-comments-chapters-20261115]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm --prefix tests/firestore ci
      - run: npx --yes firebase-tools@14.25.1 emulators:exec --only firestore --project demo-yomi-kuro "node tests/firestore/check.mjs"
